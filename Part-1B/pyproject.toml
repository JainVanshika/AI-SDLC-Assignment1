[project]
name = "expense-logger"
version = "0.1.0"
description = "A natural-language expense logger: turns one sentence about spending into a structured expense, using Google Gemini."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
expense-logger = "expense_logger.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "bandit>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_logger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "ac(id): the acceptance criterion of the specification that the test checks",
]

[tool.coverage.run]
branch = true
source = ["src/expense_logger"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C90"]

[tool.ruff.lint.isort]
known-first-party = ["expense_logger"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311", "S603", "S607"]
