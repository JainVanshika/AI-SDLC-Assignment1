[project]
name = "expense-tracker"
version = "0.1.0"
description = "A personal expense and budget tracker: a library and a command line, kept in one JSON file."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
expense = "expense_tracker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "bandit>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "ac(id): the acceptance criterion of the specification that the test checks",
]

[tool.coverage.run]
branch = true
source = ["src/expense_tracker"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311", "S603", "S607"]
